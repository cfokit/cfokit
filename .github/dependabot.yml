# Every dependency is pinned exactly — uv.lock, action commit SHAs, image tags with digests — so
# nothing changes unless a pull request changes it. This file is what keeps the pins from going
# stale: each month it proposes the updates, and CI tests them like any other change.
#
# Minor and patch updates are grouped into one pull request per ecosystem. Major updates arrive
# one at a time, because a major version is where behaviour changes and each deserves its own
# review.
#
# An update to an existing dependency is not the decision CLAUDE.md reserves. Adding a runtime
# dependency is, and nothing here adds one.
#
# Monthly, with a cooldown, and reviewed by the Monday sweep in review.yml (ADR-0048). A release
# is not proposed until it has been public for a week — a month for a major Python package, the
# only ecosystem here where Dependabot sizes the cooldown by semver — because a
# compromised release is usually caught and yanked inside that window, before any advisory
# exists to flag it. Security updates ignore both the schedule and the cooldown.

version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types: [minor, patch]

  # The Dockerfile's Python and uv images. When uv moves, move UV_VERSION in ci.yml with it.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      images:
        update-types: [minor, patch]

  # Postgres and Keycloak in compose.yaml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      services:
        update-types: [minor, patch]

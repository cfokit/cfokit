# CFOKit CI — the gates that define "done" (CLAUDE.md § CI gates).
#
# Gate 2 is the load-bearing one: the suite runs against compose.yaml WITHOUT the dev
# overlay and with no cloud credentials present, because portability is a build gate rather
# than an aspiration (ADR-0004). Nothing in this file may add cloud credentials to the
# environment of the portability job.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep this in step with requires-python in pyproject.toml and the Dockerfile's image.
  PYTHON_VERSION: "3.14"
  # uv otherwise picks any interpreter satisfying requires-python, including the runner's own.
  UV_PYTHON: "3.14"
  # The uv the image copies in (Dockerfile). Dependabot updates that one; keep this in step.
  UV_VERSION: "0.11.33"

jobs:
  # Whether a pull request changes anything the stack, its image or the web client is built or
  # tested from. When it changes only prose nothing reads, the three jobs that build the stack
  # or the client (web, portability, e2e) are skipped, and every gate a documentation change can
  # break still runs: lint, money, decisions, contracts, and the unit and documentation tests.
  #
  # Prose here means: Markdown anywhere except web/ (Prettier checks it there) and the root
  # README.md (the image copies it as package metadata), plus docs/ and .claude/, except
  # docs/contracts/ and docs/design/, which the web client reads. The image cannot see the rest:
  # .dockerignore excludes docs/ and .claude/, and nothing in the stack reads the Markdown it
  # copies. Every other path, including an unrecognized one, counts as code.
  #
  # A push to main and a manual run always count as code, so main is always fully proved.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      # A pull request checks out its merge commit; its first parent is the base it merges into,
      # so the diff between them is exactly what the pull request changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "A $EVENT run checks everything."
            exit 0
          fi
          code=false
          changed=$(git diff --name-only HEAD^1 HEAD)
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              web/*|docs/contracts/*|docs/design/*|README.md) kind=code ;;
              *.md|docs/*|.claude/*) kind=prose ;;
              *) kind=code ;;
            esac
            echo "$kind: $path"
            if [ "$kind" = code ]; then code=true; fi
          done <<< "$changed"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Changes code: $code"

  # Gate 1 — ruff, mypy --strict, import-linter layer contracts.
  lint:
    name: "Gate 1: lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
      - name: ruff, mypy --strict, import-linter
        run: uv run task lint

  # Gate 4 — no floats touch money, in the schema or in package code (ADR-0005).
  money:
    name: "Gate 4: no floats touch money"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
      - run: uv run task check-money

  # Gate 6: the decision corpus is well-formed (ADR-0001). Cheap, no infrastructure, and it
  # is the gate that keeps every other record's reasoning findable.
  decisions:
    name: "Gate 6: decision corpus is well-formed"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
      - run: uv run task check-decisions

  # Unit and documentation tests. No infrastructure required.
  test:
    name: unit and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
      - run: uv run task test

  # The web client: lint, typecheck, test and build, from web/ only (ADR-0054). No Python here,
  # and no Node in any other job but the end-to-end one, which drives a browser at the stack.
  web:
    name: web client
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
      # The pnpm version is the one package.json pins in `packageManager`.
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm lint
      - run: corepack pnpm test
      - run: corepack pnpm build
      # The design system's copy of the components, built and mounted on the React 18 that Claude
      # Design's canvas supplies (ADR-0049 § 10).
      - run: corepack pnpm design-system

  # Gate 2 — the full suite against the stack users actually run, with NO cloud
  # credentials. This job must never be given any (ADR-0004).
  portability:
    name: "Gate 2: portability (no cloud credentials)"
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert no cloud credentials are present
        # The gate is meaningless if a credential leaks in through a shared workflow
        # variable, so assert rather than assume.
        run: |
          leaked=""
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN \
                      GOOGLE_APPLICATION_CREDENTIALS GCLOUD_SERVICE_KEY GCP_SA_KEY \
                      AZURE_CLIENT_SECRET AZURE_TENANT_ID; do
            if [ -n "${!name:-}" ]; then leaked="$leaked $name"; fi
          done
          if [ -n "$leaked" ]; then
            echo "::error::Gate 2 requires no cloud credentials, but found:$leaked"
            exit 1
          fi
          echo "No cloud credentials present."

      - name: Validate the compose stack
        run: |
          docker compose -f compose.yaml config -q
          docker compose -f compose.yaml -f compose.dev.yaml config -q

      - name: Bring up compose.yaml WITHOUT the dev overlay
        run: docker compose -f compose.yaml up -d --wait --wait-timeout 180

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked

      - name: Full suite against the local stack
        run: uv run task test

      # Proves the command exists and is not a startup step (ADR-0004). It runs inside the
      # compose network via the migrate profile, because compose.yaml deliberately
      # publishes no database port and the entrypoint connects before it looks for pending
      # work. `docker compose up` above never triggers this — the profile keeps it out of
      # the default set, which is the property being tested.
      - name: Migrations run as an explicit command, never at startup
        run: docker compose -f compose.yaml --profile migrate run --rm migrate

      # The integration suite, inside the network and as the application role. It cannot run
      # in the step above: compose.yaml publishes no database port, so the host cannot reach
      # Postgres, and that is deliberate (ADR-0018). Row-level security is only actually in
      # force for a non-superuser that does not own the tables, so these are the tests that
      # can tell an enforced policy from an inert one (ADR-0003).
      - name: Integration suite, inside the compose network
        run: docker compose -f compose.yaml --profile test run --rm test

      - name: Stack diagnostics
        if: failure()
        run: docker compose -f compose.yaml ps && docker compose -f compose.yaml logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml down -v

  # Getting started, end to end: a new person registers on the issuer's page, imports the sample
  # export and reaches the first question, in a real browser against compose.yaml without the dev
  # overlay and with no cloud credentials, as Gate 2 runs (ADR-0049's confirmation, ADR-0058).
  #
  # Its video is the onboarding screencast. The run is paced for a person to follow, which costs
  # about fifteen seconds and saves running the test twice; it is kept as an artifact on every run
  # and published from main for the README.
  e2e:
    name: getting started, end to end
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bring up compose.yaml WITHOUT the dev overlay
        run: docker compose -f compose.yaml up -d --wait --wait-timeout 240
      - name: Create the schema
        run: docker compose -f compose.yaml --profile migrate run --rm migrate

      # The browser trusts the stack's CA the way a person's does after the README's one-time
      # step: in the system store Chromium reads on Linux, NSS. No certificate check is skipped.
      - name: Trust the stack's CA in the browser's certificate store
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libnss3-tools ffmpeg
          mkdir -p "$HOME/.pki/nssdb"
          certutil -d "sql:$HOME/.pki/nssdb" -N --empty-password
          certutil -d "sql:$HOME/.pki/nssdb" -A -t "C,," -n "CFOKit local CA" -i .local/tls/ca/ca.pem

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
      - run: corepack pnpm install --frozen-lockfile
        working-directory: web
      - run: corepack pnpm exec playwright install --with-deps chromium
        working-directory: web

      - name: Getting started, in Chromium
        working-directory: web
        env:
          E2E_PACE: "1200"
          # The test reads the books back over REST from Node, which trusts the same CA.
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/.local/tls/ca/ca.pem
        run: corepack pnpm e2e

      # The screencast: an MP4 to watch, and a GIF small enough for a README to show inline.
      - name: Make the recording
        working-directory: web
        run: |
          mkdir -p recording
          video=$(find test-results -name video.webm | head -1)
          ffmpeg -loglevel error -i "$video" -c:v libx264 -pix_fmt yuv420p -movflags +faststart \
            recording/onboarding.mp4
          ffmpeg -loglevel error -i "$video" \
            -vf "fps=8,scale=800:-1:flags=lanczos,split[a][b];[a]palettegen[p];[b][p]paletteuse" \
            recording/onboarding.gif
          ls -la recording
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onboarding-recording
          path: web/recording/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-report
          path: |
            web/playwright-report/
            web/test-results/

      - name: Stack diagnostics
        if: failure()
        run: docker compose -f compose.yaml ps && docker compose -f compose.yaml logs --tail 200
      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml down -v

  # The recording from main, at a fixed address the README links to: the assets of one prerelease,
  # replaced on every push to main. GITHUB_TOKEN is the only credential, and only this job writes.
  recording:
    name: publish the getting-started recording
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: onboarding-recording
          path: recording
      - name: Replace the release's assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view onboarding-recording >/dev/null 2>&1 ||
            gh release create onboarding-recording --prerelease --target main \
              --title "Getting started, recorded" \
              --notes "The getting-started flow, recorded by CI from main on every push. Not a release of CFOKit."
          gh release upload onboarding-recording recording/onboarding.mp4 recording/onboarding.gif --clobber

  # Gate 3 — differential test against the Beancount oracle, every divergence documented
  # (ADR-0010). Beancount is a CI-only dependency and never ships in the artifact.
  #
  # Enabled when LED-18 activates lot tracking, which is what the oracle is for (ADR-0010).
  #
  # oracle:
  #   name: "Gate 3: Beancount oracle"
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #     - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
  #     - run: uv sync --locked --group oracle
  #     - run: uv run pytest -m oracle

  # Gate 5 — generated OpenAPI, MCP tool descriptions and error codes match what is
  # committed; a diff means a contract change and needs review (ADR-0015).
  contracts:
    name: "Gate 5: published interfaces unchanged"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
      - run: uv run task generate-contracts
      # No database is touched to generate these, so this job needs no services.
      - run: git diff --exit-code -- docs/contracts/

  # A single required check, so the branch protection rule does not need editing every time
  # a gate is added.
  gates:
    name: All gates
    if: always()
    needs: [changes, lint, money, decisions, test, web, portability, e2e, contracts]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any gate failed
        # Each result is checked individually and compared exactly. Substring-matching the
        # joined string would pass on "success failure success", and inverted grep is easy
        # to get subtly wrong, so neither is used here.
        #
        # Every job in `needs` must succeed. The one exception is `skipped`, accepted only for
        # web, portability and e2e, and only when `changes` succeeded and said the pull request
        # changes no code. A skip for any other reason (a failed `changes` skips its dependents
        # too) fails here, as do failure and cancellation.
        env:
          NEEDS: ${{ toJSON(needs) }}
          CHANGES_CODE: ${{ needs.changes.outputs.code }}
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          failed=0
          for job in $(jq -r 'keys[]' <<< "$NEEDS"); do
            result=$(jq -r --arg job "$job" '.[$job].result' <<< "$NEEDS")
            echo "gate $job: $result"
            if [ "$result" = "success" ]; then continue; fi
            if [ "$result" = "skipped" ] && [ "$CHANGES_RESULT" = "success" ] \
               && [ "$CHANGES_CODE" = "false" ]; then
              case "$job" in
                web|portability|e2e)
                  echo "  skipped: the pull request changes no code this job builds or tests"
                  continue ;;
              esac
            fi
            failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more CI gates did not succeed."
            exit 1
          fi
          echo "All gates passed."

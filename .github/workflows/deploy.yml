# Production deploy: every merge to main, once CI has passed on it (ADR-0060 § 5).
#
# Authenticates by Workload Identity Federation: GCP admits this repository's main branch and
# nothing else, so no key exists to store. The deploy identity can push images, run the migration
# job, write the web bucket and roll out revisions; it cannot change infrastructure, which a
# person applies from infra/gcp/ (ADR-0060 § 6).
#
# Skipped until the repository variables infra/gcp/setup/github.sh sets exist, so main stays green
# on a fork that has not deployed, or before the first apply.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.GCP_DEPLOY_SERVICE_ACCOUNT != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    environment: production
    env:
      CFOKIT_PROJECT: ${{ vars.GCP_PROJECT }}
      CFOKIT_REGION: ${{ vars.GCP_REGION }}
      CFOKIT_DOMAIN: ${{ vars.CFOKIT_DOMAIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # The same script the Cloud Shell tutorial runs for the first deploy: build, migrate,
      # publish the web build, roll out, check (infra/gcp/setup/deploy.sh).
      - name: Deploy
        run: infra/gcp/setup/deploy.sh "$(git rev-parse HEAD)"

name: Import report
description: Report the result of importing your QuickBooks Online books, whether it reconciled or not.
title: "Import report: [structure], [basis]"
labels: ["import"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing the import. Describe your books in words only. **Never attach your data, exports, or screenshots of them.**

  - type: dropdown
    id: structure
    attributes:
      label: Business structure
      options:
        - Sole proprietorship
        - Single-member LLC
        - Multi-member LLC or partnership
        - S corporation
        - C corporation
        - Nonprofit
        - Other (describe below)

  - type: dropdown
    id: basis
    attributes:
      label: Accounting basis
      options:
        - Cash
        - Accrual
    validations:
      required: true

  - type: input
    id: industry
    attributes:
      label: Industry
      placeholder: e.g. professional services, retail, construction

  - type: checkboxes
    id: tracks
    attributes:
      label: What your books track
      options:
        - label: Accounts receivable (invoices and customer payments)
        - label: Accounts payable (bills and vendor payments)
        - label: Multiple bank and credit card accounts
        - label: Payment processor payouts, such as Stripe or Square
        - label: Payroll
        - label: Contractors paid on 1099s
        - label: Sales tax
        - label: Inventory and cost of goods sold
        - label: Fixed assets and depreciation
        - label: Loans and other liabilities
        - label: Owner contributions, draws or distributions
        - label: Deferred revenue
        - label: Classes, locations or projects
        - label: Multiple currencies

  - type: textarea
    id: history
    attributes:
      label: Anything unusual about the history
      description: For example edits to closed periods, voids, manual journal entries, uncategorized transactions, or a change of basis or chart of accounts.

  - type: input
    id: years
    attributes:
      label: Years of history imported

  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Reconciled
        - Reconciled with explained variances
        - Unexplained variances remain
        - Import failed
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Which accounts differ and by what, how any variances were explained, or for a failure, what happened and the shape of the data that caused it. Describe it in words, without the data.

  - type: input
    id: environment
    attributes:
      label: CFOKit commit, runtime and model
      placeholder: e.g. 467cc7c, Claude Desktop, Claude Opus

  - type: checkboxes
    id: privacy
    attributes:
      label: Your data
      options:
        - label: This report contains no financial data, exports, or screenshots of them.
          required: true

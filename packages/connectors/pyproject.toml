[project]
name = "cfokit-connectors"
version = "0.0.0"
description = "Transaction feed ingestion — bank and payment-processor connectors"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"

# Deliberately does not depend on cfokit-ledger. Connectors reach the ledger over its
# public API, and import-linter enforces it (ADR-0015).
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfokit"]

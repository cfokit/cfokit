# CFOKit — production-shaped local deployment (ADR-0018).
#
# `docker compose up` gives you a real deployment holding real books, not a demo. Self
# hosting on a laptop is a product promise, and it requires no cloud account: the OAuth
# issuer runs here too (ADR-0019).
#
# Development differences live in compose.dev.yaml and are applied EXPLICITLY:
#
#     uv run task dev        # == docker compose -f compose.yaml -f compose.dev.yaml up
#
# There is deliberately no docker-compose.override.yml. It auto-applies, which would mean
# `docker compose up` silently hands you bind mounts, debug logging, and an exposed
# database. For a financial application, explicit beats idiomatic (ADR-0018).
#
# Data lives in the named volume `ledger-data`. `docker compose down -v` DESTROYS IT.

name: cfokit

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cfokit
      POSTGRES_USER: cfokit
      # Local-only credential. Managed deployments inject this from a secret store; IaC
      # creates secret containers, never values (ADR-0016).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cfokit}
      # Consumed by the init script below, not by Postgres itself.
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-cfokit_app}
    volumes:
      - ledger-data:/var/lib/postgresql/data
      # Creates the non-superuser role the application connects as. Runs once, on an empty
      # data directory. Without it the RLS policies in migration 0001 are inert, because a
      # superuser bypasses them (ADR-0003).
      - ./infra/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-init-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfokit -d cfokit"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # No ports published. Nothing outside the compose network needs the database; the dev
    # overlay exposes it deliberately.

  # The identity provider. A default, not a coupling — the application reads AUTH_ISSUER_URL
  # and AUTH_AUDIENCE and nothing else, and any issuer meeting the conformance contract in
  # infra/README.md can replace it (ADR-0019). Apache 2.0; no copyleft in the shipped stack.
  #
  # A *complete* identity provider, which is the whole reason it is this one. `IAM-10` forbids
  # CFOKit from operating a login flow or storing a password, and `IAM-06` requires a running
  # deployment to be usable as it stands — so the issuer has to bring its own user store and
  # login pages, or a self-hoster is left to supply the one thing we may not write.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    # `start-dev` serves plain HTTP, which is why same-machine access over localhost needs no
    # TLS. Cross-device access requires a tunnel and KC_HOSTNAME set to the public hostname
    # (ADR-0018), the same condition PUBLIC_BASE_URL already carries.
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The realm is imported at startup from the file mounted below.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: cfokit
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-cfokit}
      # The issuer's own identity, and it must be the one every party uses: the application
      # validates a token's `iss` against AUTH_ISSUER_URL, so an issuer advertising one
      # hostname while services reach it at another rejects every token it issues.
      #
      # `keycloak` is the name that resolves inside the compose network. A browser needs it to
      # resolve too, for the authorization-code flow: add `127.0.0.1 keycloak` to your hosts
      # file, or run behind a tunnel with this and AUTH_ISSUER_URL set to the public hostname.
      #
      # **The port is the same inside and outside**, which is load-bearing rather than tidy. A
      # client discovers this address from the ledger's protected-resource metadata and goes to
      # it directly, so it has to mean the same thing from both sides. Published on the
      # container's own port rather than mapped to a different one, because a mapping makes the
      # advertised address wrong for exactly one of the two — and on this network 8080 is the
      # ledger, so a browser following the chain to `keycloak:8080` would reach the ledger and
      # be answered.
      KC_HTTP_PORT: "8180"
      KC_HOSTNAME: ${KC_HOSTNAME:-http://keycloak:8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # The first administrator. Local-only, like POSTGRES_PASSWORD above; a managed
      # deployment injects this from a secret store, and IaC creates secret containers rather
      # than values (ADR-0016). Change it before exposing this to anything.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      # What makes the deployment usable as it stands: the audience binding every token needs,
      # and the registration policy that lets a client register itself. infra/keycloak/README.md
      # explains each part.
      - ./infra/keycloak/cfokit-realm.json:/opt/keycloak/data/import/cfokit-realm.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8180}:8180"
    healthcheck:
      # The management port, which is where Keycloak serves health from. Readiness rather than
      # liveness here, because everything else waits on this one being able to issue tokens.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"UP\"' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # The ledger service (ADR-0023: one image, many entrypoints — this one runs the
  # REST adapter). Migrations are NOT applied here; run the migrate profile below.
  ledger:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      # The complete configuration surface. Adding to it requires an ADR, because
      # infra/README.md is the portability contract (ADR-0016).
      # The application connects as cfokit_app, which is not a superuser and does not own
      # the tables, so row-level security actually applies to it. The migrate job below
      # connects as the owner instead, because applying DDL needs privileges the application
      # must never hold (ADR-0003, ADR-0007). Same variable, different value per entrypoint.
      DATABASE_URL: postgresql://cfokit_app:${POSTGRES_APP_PASSWORD:-cfokit_app}@postgres:5432/cfokit
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      AUTH_ISSUER_URL: ${AUTH_ISSUER_URL:-http://keycloak:8180/realms/cfokit}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-cfokit-ledger}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${PORT:-8080}:8080"
    healthcheck:
      # Liveness only — /readyz would restart the container whenever the database
      # blipped or a migration was outstanding (ADR-0004).
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Migrations are an explicit command, never a startup step (ADR-0004). Behind a
  # profile so `docker compose up` never applies them:
  #
  #   docker compose --profile migrate run --rm migrate
  migrate:
    profiles: ["migrate"]
    build:
      context: .
      target: runtime
    command: ["python", "-m", "cfokit.ledger.migrations"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cfokit:${POSTGRES_PASSWORD:-cfokit}@postgres:5432/cfokit

  # The MCP surface (ADR-0023: one image, many entrypoints). Streamable HTTP, stateless, so
  # it survives a scale-to-zero platform without holding a session (ADR-0012, ADR-0017).
  # Every request carries its own bearer token, which is what makes that free.
  mcp:
    build:
      context: .
      target: runtime
    command: ["python", "-m", "cfokit.server", "mcp"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      # The same surface the REST service reads, and the same issuer and audience: one
      # authentication path, exercised by both (ADR-0019, ADR-0032).
      DATABASE_URL: postgresql://cfokit_app:${POSTGRES_APP_PASSWORD:-cfokit_app}@postgres:5432/cfokit
      # PUBLIC_BASE_URL is what a client fetches protected-resource metadata from, so it is
      # this service's own address rather than the REST service's (ADR-0004).
      PUBLIC_BASE_URL: ${MCP_PUBLIC_BASE_URL:-http://localhost:8081}
      AUTH_ISSUER_URL: ${AUTH_ISSUER_URL:-http://keycloak:8180/realms/cfokit}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-cfokit-ledger}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "8081"
      # Where the import tools may read from. Unset by default, and unset means the tools are
      # not registered at all — a tool taking a path is a file-read primitive, and one any
      # holder of a token can reach should not exist unless it was asked for (ADR-0040).
      #
      # To import an export, set IMPORT_ROOT to the in-container path and mount the directory
      # holding it:
      #
      #   IMPORT_ROOT=/imports docker compose up mcp
      #
      # with the volume below uncommented and pointed at the directory on your machine. Mount
      # the directory the file is in, not your home directory: whatever is mounted is what the
      # tools can read.
      IMPORT_ROOT: ${IMPORT_ROOT:-}
      # Where the detail of a plan or an import is written. Deliberately not the directory
      # above: exports are mounted read-only by anyone who has thought about it, and a tool
      # writing beside them fails on a correctly configured deployment. Unset means no file.
      IMPORT_REPORTS: ${IMPORT_REPORTS:-}
    # volumes:
    #   - ${IMPORT_SOURCE:-./imports}:/imports:ro
    #   - ${IMPORT_REPORTS_SOURCE:-./reports}:/reports
    ports:
      - "${MCP_PORT:-8081}:8081"
    healthcheck:
      # Liveness only, for the same reason as the REST service: /readyz would restart the
      # container whenever the database blipped or a migration was outstanding (ADR-0004).
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8081/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # The suite, run inside the compose network (ADR-0023: one image, many entrypoints).
  # compose.yaml deliberately publishes no database port, so a host-run integration test
  # cannot reach Postgres — and CI gate 2 runs this file without the dev overlay. Running
  # the tests here is what lets the write path's guarantees be proved against the stack
  # users actually run, rather than asserted.
  #
  #   docker compose --profile test run --rm test
  #
  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    depends_on:
      postgres:
        condition: service_healthy
      # The issuer, because the conformance suite drives it. `infra/README.md` states a
      # contract any issuer must meet and once claimed a suite verified it; the suite now
      # exists, and it needs the thing it measures to be running (ADR-0019).
      keycloak:
        condition: service_healthy
    environment:
      # As the application role, so an integration test sees exactly the privileges and the
      # row-level security the application runs under.
      DATABASE_URL: postgresql://cfokit_app:${POSTGRES_APP_PASSWORD:-cfokit_app}@postgres:5432/cfokit
      # Owner connection, for fixtures that need to create an entity before RLS scoping
      # applies, and for the migration the suite applies before it starts.
      DATABASE_OWNER_URL: postgresql://cfokit:${POSTGRES_PASSWORD:-cfokit}@postgres:5432/cfokit
      # What the conformance suite measures. The same two variables the application reads,
      # so the suite checks the issuer a deployment would actually use (ADR-0019).
      AUTH_ISSUER_URL: ${AUTH_ISSUER_URL:-http://keycloak:8180/realms/cfokit}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-cfokit-ledger}
      # Hydra implements RFC 7591 here but does not advertise it, so a client cannot discover
      # it. Stated for the conformance suite alone, so the token-issuing half of the contract
      # is measured instead of skipped behind that failure. Not part of the application's
      # configuration surface, and not read by anything that serves traffic.
      AUTH_REGISTRATION_ENDPOINT: ${AUTH_REGISTRATION_ENDPOINT:-}

volumes:
  ledger-data:

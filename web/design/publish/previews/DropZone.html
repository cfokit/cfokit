<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>DropZone — preview</title>
  </head>
  <body>
    <div id="root" style="padding: 24px"></div>
    <script>
      var C = window.CFOKit,
        h = React.createElement;
      ReactDOM.createRoot(document.getElementById("root")).render(
        h(C.DropZone, {
          prompt: "Drop the QuickBooks export here, or choose it from your computer.",
          accept: ".zip",
          onFile: function () {},
          onReject: function () {},
        }),
      );
    </script>
  </body>
</html>

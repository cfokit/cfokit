[project]
name = "cfokit"
version = "0.0.0"
description = "The open source CFO toolkit"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"

# Runtime dependencies are load-bearing and few. Adding one is a decision, not a
# convenience — ask before adding any (CLAUDE.md). Licences verified 2026-08-19.
dependencies = [
    # Postgres driver. Returns NUMERIC as Decimal, which ADR-0005 makes a selection
    # criterion. Dual-mode: we use the synchronous API, and AsyncConnection exists if
    # ADR-0024 is ever revisited. LGPL-3.0-only, which is not a constraint for a
    # server-side dependency resolved from an index (CLAUDE.md, Licensing).
    "psycopg[binary]>=3.2",
    # REST adapter. FastAPI with synchronous `def` handlers only — the event loop
    # lives in the server, not in our code, and scripts/check_async.py enforces that
    # (ADR-0024). Chosen over flask+apiflask on measurement: starlette and pydantic
    # arrive with the MCP SDK regardless, so this is 2 net new packages against 15.
    # MIT; starlette BSD-3-Clause.
    "fastapi>=0.115",
    # ASGI server for both the REST and MCP entrypoints. Declared directly because we
    # invoke it, rather than relied on transitively through mcp. BSD-3-Clause.
    "uvicorn>=0.34",
    # MCP tool surface. Async, and the sole reason async exists in this codebase —
    # confined to cfokit.ledger.mcp and enforced by scripts/check_async.py (ADR-0024).
    # The SDK owns its own server (mcp.server.runner). MIT.
    "mcp>=2.0",
    # JWT and JWKS validation. Audience validation is mandatory on every request
    # (ADR-0011, ADR-0019), and the REST adapter needs it independently of the MCP
    # SDK's own auth support. Declared directly rather than relied on transitively
    # through mcp — a transitive dependency we call into is one that can vanish in a
    # patch release. MIT; the crypto extra is cryptography, Apache-2.0 OR BSD-3-Clause.
    "pyjwt[crypto]>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# One distribution holding every capability, because ADR-0023 ships one image with many
# entrypoints — so nothing is ever installed or versioned separately. Capabilities are
# sibling packages under src/cfokit/, named for what they provide (ADR-0031).
#
# PEP 420 implicit namespace package: there is deliberately no src/cfokit/__init__.py.
# Nothing needs one today, and its absence keeps a genuinely separate cfokit-<capability>
# distribution possible later without a migration.
packages = ["src/cfokit"]

[dependency-groups]
dev = [
    "ruff>=0.14",
    # Writes the synthetic .xlsx the reader tests are built from. **Dev, not runtime.** It was
    # runtime while the server parsed exports; it stopped being so when parsing moved to the
    # agent's runtime, where the reader is standard-library only and installs nothing (ADR-0041).
    # Reading an .xlsx by hand concentrates its risk in shared strings, styles deciding
    # date-from-number, and the 1900 leap-year bug — real risks, which is why the reader is
    # tested against the export this builds and was proven field-for-field against the openpyxl
    # reader it replaces before that one was deleted. MIT, pulls only et-xmlfile, also MIT
    # (verified 2026-09-05 from the installed artifacts' metadata, not from memory).
    "openpyxl>=3.1",
    "mypy>=1.18",
    "pytest>=8.4",
    "import-linter>=2.3",
    "taskipy>=1.14",
    # Property testing. ADR-0025 requires allocation to be property-tested and ADR-0036
    # layer 1 names four arithmetic invariants; shrinking a counterexample to its minimal
    # form is the part that makes a failure diagnosable, and is why this is a dependency
    # rather than a hand-rolled generator.
    #
    # MPL-2.0 (verified 2026-09-01 from the installed artifact's License-Expression, not
    # from memory). Weak copyleft, triggering on distribution of the covered files — which
    # never happens: it is dev-group only, the image builds with `uv sync --no-dev`, and
    # `uv export --no-dev` does not contain it. CLAUDE.md scopes the licence question by
    # what triggers the obligation, and CI-only tooling is fine including copyleft.
    # Pulls sortedcontainers (Apache-2.0), likewise dev-only.
    "hypothesis>=6.167.1",
    # Drives the MCP SDK's own client against the app in process, so ADR-0036 layer 3 can
    # exercise the real transport rather than `call_tool` dispatch. It arrives anyway as an
    # `mcp` transitive; declared here so the suite depends on something stated rather than
    # borrowed. BSD-3-Clause (verified 2026-09-02 from the installed artifact's metadata).
    "httpx2>=0.29",
    # Stubs for openpyxl, which is a runtime dependency above. Only the stubs are dev: the
    # reader type-checks under `mypy --strict` like everything else rather than earning an
    # exemption, and typeshed stubs ship to nobody. Apache-2.0.
    "types-openpyxl>=3.1",
]

# ---------------------------------------------------------------------------
# Commands. These names are documented in CLAUDE.md; keep them in sync.
# ---------------------------------------------------------------------------
[tool.taskipy.tasks]
test = { cmd = "pytest", help = "Run the suite. Pass a path to scope it: task test tests/test_migrations.py" }
lint = { cmd = "ruff check . && ruff format --check . && mypy && lint-imports && python scripts/check_async.py", help = "CI gate 1: ruff, mypy --strict, import-linter, async boundary" }
migrate = { cmd = "python -m cfokit.ledger.migrations", help = "Apply migrations. Never runs at startup (ADR-0004)" }
dev = { cmd = "docker compose -f compose.yaml -f compose.dev.yaml up", help = "Local stack with the dev overlay explicitly applied (ADR-0018)" }
"check-money" = { cmd = "python scripts/check_money.py", help = "CI gate 4: no floats touch money, in schema or code (ADR-0005)" }
"check-decisions" = { cmd = "python scripts/check_decisions.py", help = "CI gate 6: the decision corpus is well-formed (ADR-0001)" }
"generate-contracts" = { cmd = "python scripts/generate_contracts.py", help = "CI gate 5: regenerate the published interfaces; a diff is a contract change (ADR-0015)" }

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 96
target-version = "py312"
extend-exclude = []

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # bugbear
    "S",         # bandit
    "A",         # builtin shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetimes — dates matter in accounting
    "T20",       # no print(); use structured logging
    "RET", "SIM", "PTH", "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]              # assert is the point of a test
"scripts/**" = ["T201"]            # CI scripts report to stdout
# An operator command, read by a person at a terminal. Its whole output is the report.
"src/cfokit/imports/__main__.py" = ["T201"]
# Shipped with the skill and run in the agent's runtime, where stdout is the contract (ADR-0041).
# Linted and formatted here because it is ours; not type-checked with the package, because it
# imports nothing from it and must run on a bare interpreter.
"skills/**" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["cfokit"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy — strict is a CI gate, not a preference
# ---------------------------------------------------------------------------
[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "scripts", "tests"]
# `tests/integration` is on the path for the same reason `scripts` is on pytest's:
# `tests` is deliberately not a package, so a helper module beside a test file is
# imported absolutely, the way pytest's default import mode resolves it.
mypy_path = ["src", "scripts", "tests/integration"]
namespace_packages = true
explicit_package_bases = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires the compose stack (Postgres, issuer)",
    "oracle: differential test against the Beancount oracle (ADR-0010)",
    "eval: asserts on the records an agent's turn leaves behind (ADR-0036 § 4)",
]

# ---------------------------------------------------------------------------
# import-linter — enforces the boundaries CLAUDE.md declares (CI gate 1)
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["cfokit"]
# Required to name an external package (psycopg) in a forbidden contract.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Ledger is layered; the booking engine sits at the bottom (ADR-0008, ADR-0009)"
type = "layers"
layers = [
    "cfokit.ledger.api | cfokit.ledger.mcp",
    # Presentation sits between the adapters and the service: both adapters render through it
    # and nothing below it may. ADR-0025 puts rounding at presentation and forbids it in
    # engine, repository and service — this is that boundary, gated rather than reviewed.
    "cfokit.ledger.presentation",
    "cfokit.ledger.service",
    "cfokit.ledger.repository",
    "cfokit.ledger.engine",
]

[[tool.importlinter.contracts]]
name = "Booking engine is pure — no configuration, no I/O, no adapters (ADR-0008)"
type = "forbidden"
source_modules = ["cfokit.ledger.engine"]
forbidden_modules = [
    "cfokit.ledger.config",
    "cfokit.ledger.repository",
    "cfokit.ledger.service",
    "cfokit.ledger.presentation",
    "cfokit.ledger.api",
    "cfokit.ledger.mcp",
]

[[tool.importlinter.contracts]]
# ADR-0028's Confirmation claims this contract. It did not exist, and `service/readiness.py`
# was importing the driver directly — so the rule keeping SQL in one readable place was
# review-enforced while the record said it was gated. `migrations` is not listed because the
# migrate entrypoint legitimately opens its own connection (ADR-0004).
name = "Only the repository layer names the database driver (ADR-0028)"
type = "forbidden"
source_modules = [
    "cfokit.ledger.engine",
    "cfokit.ledger.service",
    "cfokit.ledger.api",
    "cfokit.ledger.mcp",
]
forbidden_modules = ["psycopg"]
# Direct imports only. Reaching the database *through* `repository` is the design; what is
# forbidden is naming the driver anywhere else, which is what puts SQL in one readable place.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
# ADR-0022's Confirmation: "The contracts encoding 'modules depend on the ledger, never on each
# other, and the ledger depends on no module' do not exist yet — there is no module to
# constrain — and they are added as the first one lands." `cfokit.imports` is the first.
#
# One direction only. A module may reach into any layer of the ledger, because it is a caller
# like an adapter is; the ledger may not reach back, because the moment it does it has learned
# what a QuickBooks export is and the tiny-ledger boundary has moved.
name = "The ledger depends on no module (ADR-0022)"
type = "forbidden"
source_modules = ["cfokit.ledger"]
forbidden_modules = ["cfokit.imports", "cfokit.receivables", "cfokit.assignment"]

[[tool.importlinter.contracts]]
# ADR-0022 forbids module-to-module dependencies: "modules depend on the ledger, never on each
# other". `receivables` is the second module, so the rule is now expressible — a contract
# naming one module would have asserted nothing while reading as though it did.
#
# Independent rather than layered: neither is above the other, and a dependency in either
# direction is the thing forbidden.
name = "Modules depend on the ledger, never on each other (ADR-0022)"
type = "independence"
modules = ["cfokit.imports", "cfokit.receivables", "cfokit.assignment"]

# NOTE: a contract forbidding provider SDKs at module scope (ADR-0004) is added when
# the first provider SDK is introduced — import-linter errors on modules it cannot find.

# A conformance case: figures and answer taken from a published source, not from us.
#
# The richest problem in the book — a manufacturing firm's books closed with depreciation, a
# discount reserve, unexpired insurance, interest on partners' capital, and the profit
# divided. It replaces the corpus's only cited-rule evidence for prepaid expenses with a
# published answer, which is the stronger kind (ADR-0044).

name = "greendlinger-1911-q01"

[source]
title = "Accountancy Problems with Solutions"
author = "Leo Greendlinger"
publisher = "Business Book Bureau"
year = 1911
problem = "Question 1"
origin = "New York Examination, December 1898"
scan = "https://archive.org/details/accountancyprob00greegoog"
licence = "public-domain"
pd_basis = "term-expired"

[coverage]
areas = [
  "adjusting-entries",
  "depreciation",
  "bad-debts",
  "prepaid-expenses",
  "income-statement",
]
requirements = ["LED-04", "RPT-02", "AR-18", "BKP-04"]

[entity]
accounting_basis = "accrual"
fiscal_year_end_month = 12
fiscal_year_end_day = 31
functional_currency = "USD"

[expected]
answer = "profit_and_loss"
since = 1896-01-01
as_of = 1897-01-01
source_is_rounded = false

[transcription]
method = "double-blind"
# The journal was built from the problem statement and the expected figures from the
# published solution, by separate passes, neither reading CFOKit's source or output.
#
# **The OCR has lost the trial balance's columns entirely.** Every figure sits on one line
# with no debit or credit marking, so each had to be placed. Most are settled by their
# nature; two are not, and both are forced by the printed total of 165,500 a side:
#
#   Loan account 7,000 is a DEBIT. As a credit the columns come to 158,500 and 172,500, and
#   neither is the printed figure. So the firm had lent, not borrowed.
#
#   Rent of steam power 1,500 is a CREDIT. As a debit the columns come to 167,000 and
#   164,000. The solution confirms it independently by debiting the account to close it,
#   which only makes sense against a credit balance.
#
# "Labor , 34,000" is 24,000. With 34,000 the trial balance comes to 175,500 against the
# printed 165,500, and the solution's Manufacturing Account foots to its printed 89,075 only
# with 24,000. Two independent confirmations.
#
# Other OCR repairs, all confirmed by the same total: "20^000" is 20,000, "$35>ooo" is
# 35,000, "38/xx>" is 38,000, "95>ooo" is 95,000, "4«ooo" is 4,000, "60Q" is 600, "1-3,000"
# is 3,000, ")'.s 1,150" is 1,150, "i»500" is 1,500.
#
# **Every adjustment reproduces a rate the problem states**: 10% of 35,000 is 3,500; 3% of
# 25,000 is 750; half of 1,150 is 575, the policy running from 1 July 1896 so six of its
# twelve months are unexpired at the trial balance date; 6% of 40,000 and of 20,000 are
# 2,400 and 1,200.
#
# **The net profit is checked against a figure we did not compute.** The source does not
# print the total; it prints the two partners' shares, 9,283.33 and 4,641.67, which sum to
# exactly the 13,925.00 asserted here. The book rounds B's third up so the entry closes to
# the cent, and reproducing that is part of the case.
#
# **No clearing accounts.** The published solution works through a Manufacturing Account, a
# Trading Account and a Profit and Loss Account, in the 1890s manner. Those are period-end
# scaffolding rather than accounts of the business, and the five-type vocabulary has no
# member for them, so inventing one would have put our modeling into a case meant to be the
# source's. The economic substance is posted instead, and the figures the source prints
# against named accounts are what is asserted. Stock is handled as the solution does, the
# opening 15,000 carried to cost and the closing 23,000 taken up.
#
# **What is not asserted.** The source also prints a closing balance sheet, and it is an
# unreadable OCR table. The books do balance — assets 86,525.00 against liabilities 9,000.00,
# capital 63,600.00 and unclosed profit 13,925.00 — but that figure is ours, recomputed, and
# nowhere in the source. It is recorded here as a check we ran, not as an answer we were given.
verified_against = "the partners' printed shares and the named figures in the closing entries"

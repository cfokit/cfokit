# A conformance case: figures and answer taken from a published source, not from us.
#
# ADR-0036 § 2: "Worked examples taken from published sources with published answers, asserted
# directly against the expected result… Every case cites its source. A case with no citation is
# not conformance evidence, it is a unit test that has been misfiled."
#
# NFR-01 wants "a source of truth CFOKit did not author". This is one: a state examination
# question, solved by a practicing accountant, published fourteen years before any of us.

name = "greendlinger-1911-q25"

[source]
title = "Accountancy Problems with Solutions"
author = "Leo Greendlinger"
publisher = "Business Book Bureau"
year = 1911
problem = "Question 25"
origin = "State of Washington Examination, September 1907"
scan = "https://archive.org/details/accountancyprob00greegoog"
# Archive.org metadata records this item as NOT_IN_COPYRIGHT, and the scan's own front matter
# states the copyright has expired and the book has entered the public domain. Published 1911,
# so it is public domain in the United States on the pre-1931 rule.
licence = "public-domain"
# How it reached the public domain, not merely that it did (ADR-0044). Published 1911, so the
# 95-year term expired; no renewal question arises and no determination is needed.
pd_basis = "term-expired"

[coverage]
# What this case is evidence for, in the vocabulary of docs/conformance/coverage.md. The
# published answer is a trial balance produced from a journal, so it evidences those two and
# not the chart itself: the case uses accounts, it does not exercise hierarchy or type rules.
areas = ["recording", "trial-balance"]
requirements = ["LED-03", "LED-04", "RPT-01"]

[entity]
accounting_basis = "accrual"
fiscal_year_end_month = 12
fiscal_year_end_day = 31
functional_currency = "USD"

[expected]
answer = "trial_balance"
as_of = 1907-09-30
# The published trial balance carries whole dollars, so no rounding question arises. Set true
# only where a source's own figures have been rounded from something more precise.
source_is_rounded = false

[transcription]
method = "single-pass"
# How this case was transcribed, and therefore how much the independence is worth.
# `single-pass`: one process read problem, solution and expected values, with CFOKit's
# implementation in its context. The figures are checked against the source's own totals, but
# nothing structurally prevented the transcription drifting toward what CFOKit does.
# `double-blind`: the journal and the expected answer were produced by separate passes, each
# reading only its half of the source and neither reading CFOKit. That is what
# `.claude/commands/conformance-case.md` prescribes for a new case.
# Read from the OCR of the scan, which garbles commas — "93>500.oo" is 93,500.00 and
# "i5,ooaoo" is 15,000.00. Every figure below is confirmed by the published totals: the debit
# column sums to 355,000.00 and the credit column to 355,000.00, and capital stock
# 42,500 + 272,500 + 25,000 = 340,000 matches the published line. A misread digit would break
# one of those sums.
#
# The source prints subscribers as one line of 42,500.00 with a memo breakdown of B, C, D and
# E. They are encoded as four accounts here because the published journal debits each
# separately and publishes each amount; their sum is the source's single line.
verified_against = "published column totals"
# Account types follow 1907 practice — organization expenses capitalized, treasury stock as a
# debit balance — and modern practice differs on both. Neither affects this case: a trial
# balance is grouped by sign, not by type, so the published answer is reproducible whatever
# view a later standard would take. That is why a century-old source is usable at all, and it
# is also the boundary: a case turning on how a statement classifies an account would not be.

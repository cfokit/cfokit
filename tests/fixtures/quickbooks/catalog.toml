# The cases the synthetic QuickBooks company must contain (ADR-0075).
#
# Each case is realized by business events the generator tags with its id (`generated/manifest.json`),
# or, for a file case, by a mutation of the export. An id is stable: never renamed, never reused.
#
# `check` is one of a closed set of kinds, each a plain function. It is not a query language
# (ADR-0012): no expressions, no composition, and a case that fits none gets a new kind through
# review.
#
#   balance         CFOKit's balance for `account` at `as_of` equals QuickBooks' trial balance then.
#                   The figure is never written here; it is read from what QuickBooks reported.
#                   `as_of = "month-end"` is the month end after the case's last event.
#   account         the chart has `present` (and, where given, of `type`), and has no `absent`
#   text            the entry on `on` in `account` carries `description`, byte for byte
#   skipped         the import plan declines the row with refusal `code` rather than booking it
#   refused         the reader refuses the file with refusal `code`
#   reconciliation  `journal_total` is agrees | disagrees; `divergences` is none | nets_to_zero
#
# Account names and dates in the checks are provisional until the fixture is validated against
# QuickBooks, which may print a name differently from how it was posted.

# --- Posting transaction types -------------------------------------------------------------------

[[case]]
id = "d-invoice"
category = "data"
description = "A monthly retainer invoiced on the first of the month and still open at its end."
check = { kind = "balance", account = "Accounts Receivable (A/R)", as_of = "month-end" }


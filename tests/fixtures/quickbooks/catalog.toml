[[case]]
id = "d-cash-void-after-payment"
category = "data"
description = "A payment that bounces and is voided, then the invoice paid again two weeks later."
check = { kind = "balance", account = "Accounts Receivable (A/R)", as_of = "month-end" }

[[case]]
id = "d-cash-undeposited"
category = "data"

# The cases the synthetic QuickBooks company must contain (ADR-0075).
#
# A case is one of three categories, and its id begins with the category's letter:
#
#   data     realized by business events the generator tags with the id (`generated/manifest.json`)
#   archive  realized by a rendering of the same events: a basis, a setting, a date range
#   file     realized by damaging the accrual archive after it is written
#
# An id is stable: never renamed, never reused.
#
# `check` is one of a closed set of kinds, each a plain function. It is not a query language
# (ADR-0012): no expressions, no composition, and a case that fits none gets a new kind through
# review. A check runs against the accrual archive unless it names another in `archive`.
#
#   balance         CFOKit's balance for `account` at `as_of` equals QuickBooks' trial balance
#                   then. The figure is never written here; it is read from what QuickBooks
#                   reported. `as_of = "month-end"` is the month end after the case's last event.
#   stated          the balance the reader takes from the archive's `report` for `account` equals
#                   the figure QuickBooks states in that report
#   account         the chart has `present` (and, where given, of `type`), and has no `absent`
#   text            an entry carrying `description` byte for byte is in the books (`present`,
#                   the default) or is not; `account` and `on` narrow where
#   skipped         the import plan declines the row with refusal `code` rather than booking it
#   refused         the reader refuses the file with refusal `code`
#   reconciliation  `journal_total` is agrees | disagrees; `divergences` is none | nets_to_zero |
#                   unexplained
#
# Account names and dates in the checks are provisional until the fixture is validated against
# QuickBooks, which may print a name differently from how it was posted.

# --- Posting transaction types -------------------------------------------------------------------

[[case]]
id = "d-invoice"
category = "data"
description = "A monthly retainer invoiced on the first of the month and still open at its end."
check = { kind = "balance", account = "Accounts Receivable (A/R)", as_of = "month-end" }


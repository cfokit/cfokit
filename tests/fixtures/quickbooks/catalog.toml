# --- Archives: the same events, rendered differently ----------------------------------------------

[[case]]
id = "a-accrual"
category = "archive"
description = "Every report on the accrual basis, for all dates. The baseline every other case runs against."
check = { kind = "reconciliation", journal_total = "agrees", divergences = "none" }

[[case]]
id = "a-cash"
category = "archive"
description = "Every report on the cash basis. The journal is unchanged; the statements are not."
check = { kind = "reconciliation", journal_total = "agrees", divergences = "nets_to_zero", archive = "cash" }

[[case]]
id = "a-account-numbers"
category = "archive"
description = "Account numbers turned on, so every account prints as '1000 Operating Checking'."
check = { kind = "reconciliation", journal_total = "agrees", divergences = "none", archive = "account-numbers" }

[[case]]
id = "a-partial-range"
category = "archive"
description = "Exported for the current fiscal year only, so the journal lacks every earlier year."
check = { kind = "reconciliation", journal_total = "agrees", divergences = "unexplained", archive = "partial-range" }

[[case]]
id = "a-calendar-year"
category = "archive"
description = "The fiscal year set to start in January, so the year-end rollover falls on December 31."
check = { kind = "balance", account = "Retained Earnings", as_of = "2025-01-31", archive = "calendar-year" }

# --- File cases: mutations of the export ----------------------------------------------------------
# Each check is the outcome we want. A failure is a finding, not a mistake in the case.

[[case]]
id = "f-truncated-sheet"
category = "file"
description = "The Journal sheet's XML cut mid-row, re-zipped as a valid archive."
check = { kind = "refused", code = "unreadable_archive" }

[[case]]
id = "f-extra-header-row"
category = "file"
description = "One extra row above the Journal's column headings."
check = { kind = "refused", code = "unreadable_figure" }

[[case]]
id = "f-invalid-utf8"
category = "file"
description = "An invalid UTF-8 byte inside a shared string of the Journal."
check = { kind = "refused", code = "unreadable_archive" }

[[case]]
id = "f-macos-rezip"
category = "file"
description = "Unzipped and zipped again on a Mac, which adds __MACOSX/ and ._ entries."
check = { kind = "reconciliation", journal_total = "agrees", divergences = "none" }

[[case]]
id = "f-nested-folder"
category = "file"
description = "Zipped as a folder, so every report sits under export/ rather than at the root."
check = { kind = "reconciliation", journal_total = "agrees", divergences = "none" }

[[case]]
id = "f-excel-resave"
category = "file"
description = "Each workbook opened and saved in Excel: cached values beside formulas, strings inline."
check = { kind = "reconciliation", journal_total = "agrees", divergences = "none" }

[[case]]
id = "f-single-workbook"
category = "file"
description = "Journal.xlsx chosen on its own, rather than the archive it came in."
check = { kind = "refused", code = "import_refused" }

[[case]]
id = "f-csv-instead"
category = "file"
description = "The journal exported as CSV, as the report screen offers, rather than through Export Data."
check = { kind = "refused", code = "unreadable_archive" }

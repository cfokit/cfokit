# --- Cash basis: where the cash archive departs from the accrual one ------------------------------

[[case]]
id = "d-cash-partial-multiline"
category = "data"
description = "A two-line invoice, part paid: cash basis recognizes each line in proportion, to the cent."
check = { kind = "stated", account = "Workshops", report = "profit_and_loss", archive = "cash" }

[[case]]
id = "d-cash-bill-partial-multiline"
category = "data"
description = "A two-line bill, part paid: the expense side of the same proportion."
check = { kind = "stated", account = "Repairs/Maintenance", report = "profit_and_loss", archive = "cash" }

[[case]]
id = "d-cash-unapplied-credit"
category = "data"
description = "The overpayment's unapplied $400, banked but applied to no invoice."

[[case]]
id = "d-cash-credit-memo"
category = "data"
description = "The credit memo applied to an invoice the client then pays."
check = { kind = "stated", account = "Design Services", report = "profit_and_loss", archive = "cash" }

[[case]]
id = "d-cash-vendor-credit"
category = "data"
description = "The vendor credit taken inside a bill payment."
check = { kind = "stated", account = "Cost of Services:Contractors", report = "profit_and_loss", archive = "cash" }

[[case]]

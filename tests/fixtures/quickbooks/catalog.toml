# --- Special cases ---------------------------------------------------------------------------------

[[case]]
id = "d-opening-balance-equity"
category = "data"
description = "Opening bank, equipment and loan balances on the first day, against Opening Balance Equity."
check = { kind = "balance", account = "Opening Balance Equity", as_of = "month-end" }

[[case]]
id = "d-renamed-account"
category = "data"
description = "Stock Photography renamed Stock Media halfway through, with history on both sides."
check = { kind = "account", present = ["Stock Media"], absent = ["Stock Photography"] }

[[case]]
id = "d-inactive-account"
category = "data"
description = "Telephone, used for two years, made inactive once Internet & Phone replaces it."
check = { kind = "account", present = ["Telephone (deleted)"] }

[[case]]
id = "d-name-both-sides"
category = "data"
description = "One studio is both a client and a contractor; QuickBooks needs two names, so the vendor is 'Northwind Studio (V)'."
check = { kind = "balance", account = "Accounts Payable (A/P)", as_of = "month-end" }

[[case]]
id = "d-punctuation-names"
category = "data"
description = "Account names with an ampersand and a slash, and a colon only as the sub-account separator."
check = { kind = "account", present = ["Meals & Entertainment", "Repairs/Maintenance", "Professional Fees:Legal & Accounting"] }

[[case]]
id = "d-same-leaf"
category = "data"
description = "A sub-account named Software under two different parents, both posted to."
check = { kind = "account", present = ["Cost of Services:Software", "Office Expenses:Software"] }

[[case]]
id = "d-parent-with-postings"
category = "data"
description = "Travel posted to directly as well as through its sub-account Travel:Airfare."
check = { kind = "reconciliation", journal_total = "agrees", divergences = "none" }

[[case]]
id = "d-cash-basis-reports"
category = "data"
description = "The company runs its reports on the cash basis, over a journal that is the accrual record."
check = { kind = "reconciliation", journal_total = "agrees", divergences = "nets_to_zero" }

[[case]]
id = "d-fiscal-year-july"
category = "data"
description = "The fiscal year starts on July 1, so year-to-date and retained earnings roll over mid-calendar."
check = { kind = "balance", account = "Retained Earnings", as_of = "2024-07-31" }

[[case]]
id = "d-unicode-commas"
category = "data"
description = "A client named 'Café Ñandú, LLC', invoiced with a memo carrying an em dash, commas and 東京."
check = { kind = "text", account = "Accounts Receivable (A/R)", on = "2024-03-01", description = "Q3 retainer — 東京 office, phase 2" }

# --- File cases: mutations of the export ----------------------------------------------------------
# Each check is the outcome we want. A failure is a finding, not a mistake in the case.

[[case]]
id = "f-truncated-sheet"
category = "file"
description = "The Journal sheet's XML cut mid-row, re-zipped as a valid archive."
check = { kind = "refused", code = "unreadable_archive" }

[[case]]
id = "f-extra-header-row"
category = "file"
description = "One extra row above the Journal's column headings."
check = { kind = "reconciliation", journal_total = "disagrees", divergences = "none" }

[[case]]
id = "f-invalid-utf8"
category = "file"
description = "An invalid UTF-8 byte inside a shared string of the Journal."
check = { kind = "refused", code = "unreadable_archive" }
